<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>MirroX</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>MirroX</h1>
      <p class="tagline">Your phone screen, on your computer.</p>
    </header>

    <main>
      <section class="card" id="device-card">
        <div class="status-dot" id="status-dot"></div>
        <div class="device-text">
          <div class="device-name" id="device-name">Looking for your phone…</div>
          <div class="device-status" id="device-status">Plug your phone into this computer with a USB cable.</div>
        </div>
      </section>

      <div class="hint" id="hint-box" hidden>
        <p id="hint"></p>
        <div class="details-actions" id="details-actions" hidden>
          <button class="link" id="details-toggle">Show details</button>
          <button class="link" id="details-copy" hidden>Copy details</button>
        </div>
        <pre class="details" id="details" hidden></pre>
      </div>

      <button id="mirror-btn" class="primary" disabled>Start Mirroring</button>

      <div id="message-box" hidden>
        <p class="message" id="message"></p>
        <div class="details-actions" id="mdetails-actions" hidden>
          <button class="link" id="mdetails-toggle">Show details</button>
          <button class="link" id="mdetails-copy" hidden>Copy details</button>
        </div>
        <pre class="details" id="mdetails" hidden></pre>
      </div>
    </main>

    <footer>Stage 1 preview · v0.1.1</footer>
    <script src="renderer.js"></script>
  </body>
</html>
