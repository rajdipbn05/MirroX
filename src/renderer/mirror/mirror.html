<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>MirroX</title>
    <link rel="stylesheet" href="mirror.css" />
  </head>
  <body class="mode-normal">
    <!-- Title bar (normal window) -->
    <div id="titlebar">
      <div class="tb-drag">
        <span class="tb-logo" aria-hidden="true"></span>
        <span id="tb-title">MirroX</span>
        <span id="tb-fps"></span>
      </div>
      <div class="tb-buttons">
        <button class="tb-btn" data-action="borderless" title="Borderless window (Alt+F)">
          <svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke-dasharray="2 1.5" /></svg>
          <span>Borderless</span>
        </button>
        <button class="tb-btn" data-action="fullscreen" title="Fullscreen (Alt+F)">
          <svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10" /></svg>
          <span>Fullscreen</span>
        </button>
        <button class="tb-btn pin" data-action="top" title="Always on top">
          <svg viewBox="0 0 16 16"><path d="M6 2.5h4M7 2.5v4l-2.5 2.5h7L9 6.5v-4M8 9v4.5" /></svg>
        </button>
        <span class="tb-sep"></span>
        <button class="tb-win" data-action="minimize" title="Minimize"><svg viewBox="0 0 16 16"><path d="M4 8h8" /></svg></button>
        <button class="tb-win" data-action="maximize" title="Fit to screen"><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" /></svg></button>
        <button class="tb-win close" data-action="close" title="Close"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg></button>
      </div>
    </div>

    <div id="stage">
      <canvas id="screen"></canvas>
      <div id="status">Connecting to your phone…</div>

      <!-- Appears at the top edge in borderless and fullscreen -->
      <div id="edge"></div>
      <div id="overlay">
        <span class="ov-grip" title="Drag to move">⋮⋮</span>
        <button class="ov-btn" data-action="normal" id="ov-exit">
          <svg viewBox="0 0 16 16"><path d="M6 2.5V6H2.5M10 2.5V6h3.5M13.5 10H10v3.5M6 13.5V10H2.5" /></svg>
          <span id="ov-exit-label">Exit fullscreen</span>
        </button>
        <button class="ov-btn" data-action="swap" id="ov-swap"><span id="ov-swap-label">Borderless</span></button>
        <button class="ov-btn pin" data-action="top" title="Always on top">
          <svg viewBox="0 0 16 16"><path d="M6 2.5h4M7 2.5v4l-2.5 2.5h7L9 6.5v-4M8 9v4.5" /></svg>
          <span>On top</span>
        </button>
        <button class="ov-btn" data-action="minimize" title="Minimize"><svg viewBox="0 0 16 16"><path d="M4 8h8" /></svg></button>
        <button class="ov-btn close" data-action="close" title="Close"><svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg></button>
      </div>

      <div id="hint" hidden></div>
    </div>

    <script src="mirror.js"></script>
  </body>
</html>
