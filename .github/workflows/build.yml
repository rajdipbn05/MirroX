# Builds the Windows app on every update to main and publishes it as a
# downloadable file on the GitHub "Releases" page.
name: Build Windows app

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist:win

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MirroX ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/MirroX-*-portable.exe
          body: |
            **How to install:** download `MirroX-${{ steps.version.outputs.version }}-portable.exe` below and double-click it. No installation needed.
            If Windows shows "Windows protected your PC", click **More info** → **Run anyway**.
